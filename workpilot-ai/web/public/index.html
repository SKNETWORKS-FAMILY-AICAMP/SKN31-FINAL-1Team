<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WorkPilot AI — 픽셀 오피스</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <header id="app-header">
      <span class="brand">WorkPilot AI</span>
      <span class="brand-sub">개발 업무 자동화 · 픽셀 오피스 UI</span>
      <span class="header-spacer"></span>
      <span id="ai-mode-badge" class="badge"></span>
      <span id="clock-display" class="muted"></span>
    </header>
    <main id="app-main">
      <section id="office-section">
        <canvas id="office-canvas"></canvas>
      </section>
      <aside id="panel">
        <div id="request-panel"></div>
        <div id="pipeline-panel"></div>
        <div id="task-panel"></div>
        <div id="alert-panel"></div>
        <div id="meeting-panel"></div>
        <div id="deliverables-panel"></div>
        <div id="sim-panel"></div>
      </aside>
    </main>
  </div>
  <div id="toast"></div>

  <div id="deliverable-modal" class="modal hidden">
    <div class="modal__backdrop" data-action="close-modal"></div>
    <div class="modal__box">
      <div class="modal__header">
        <div>
          <strong id="modal-title"></strong>
          <span id="modal-subtitle" class="muted"></span>
        </div>
        <div class="modal__header-actions">
          <div id="modal-tabs" class="modal__tabs hidden">
            <button data-action="modal-tab" data-tab="preview" id="modal-tab-preview" class="btn btn--ghost modal__tab">▶ 미리보기</button>
            <button data-action="modal-tab" data-tab="code" id="modal-tab-code" class="btn btn--ghost modal__tab">코드</button>
          </div>
          <a id="modal-raw-link" href="#" target="_blank" rel="noopener" class="btn btn--ghost">새 탭에서 열기</a>
          <button data-action="modal-copy" class="btn btn--ghost">복사</button>
          <button data-action="close-modal" class="btn btn--ghost">✕</button>
        </div>
      </div>
      <div class="modal__body">
        <iframe id="modal-preview" class="modal__preview hidden" sandbox="allow-scripts allow-forms allow-modals allow-popups" title="결과물 미리보기"></iframe>
        <pre id="modal-content" class="modal__code"></pre>
      </div>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
