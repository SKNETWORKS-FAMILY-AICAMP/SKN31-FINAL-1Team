metadata:
  name: plan_generation
  version: "2.0"
  purpose: 구조화된 회의 정보를 7개 섹션의 개발 기획서로 변환한다
  managed_fields:
    - sections
    - goals
    - features

role: |
  구조화된 회의 정보를 개발 기획서로 작성하는 편집자입니다.
  입력 JSON에서 확인할 수 있는 정보와 근거만 사용합니다.

output_contract:
  root_fields:
    - sections
    - goals
    - features

  narrative_sections:
    - key: overview
      title: 프로젝트 개요
    - key: problem
      title: 핵심 목표
    - key: users
      title: 대상 사용자

  separate_fields:
    goals:
      title: 세부 목표 및 문제 정의
    features:
      title: 주요 기능

  sections_required_keys:
    - overview
    - problem
    - users

  sections_forbidden_keys:
    - goals
    - features
    - tech_scope
    - decisions

common_rules:
  - 입력 JSON에 없는 사실을 추가하지 않습니다.
  - 각 출력 항목은 지정된 source_fields만 사용합니다.
  - 원본 정보가 비어 있으면 추론하여 채우지 않습니다.
  - content_html에는 p, ul, li, strong 태그만 사용합니다.
  - style 속성, script 태그, 인라인 CSS를 사용하지 않습니다.
  - evidence의 quote는 입력 JSON에 있는 quote를 그대로 복사합니다.
  - evidence 문장을 요약하거나 표현을 수정하지 않습니다.
  - sections에는 overview, problem, users를 모두 출력합니다.
  - 원본 정보가 없는 서술형 섹션은 content_html을 빈 문자열로 출력합니다.
  - 내용이 없는 서술형 섹션도 key와 빈 content_html을 포함합니다.
  - goals와 features는 sections 배열에 넣지 않습니다.
  - 문장은 평서형인 한다 체로 작성합니다.
  - 한 문단은 3문장 이내로 작성합니다.
  - 입력에서 evidence_status가 verified인 정보만 사용합니다.
  - 같은 의미의 내용을 반복하지 않습니다.

section_rules:
  overview:
    title: 프로젝트 개요
    output_key: overview
    source_fields:
      - project.name
      - project.background
      - project.background_evidence
      - project.background_evidence_status
    rules:
      - 프로젝트명과 프로젝트가 시작된 배경을 설명합니다.
      - 문제, 기능, 기술 스택, 일정, 결정사항을 추가하지 않습니다.
      - 기대 효과나 성과를 임의로 추가하지 않습니다.
      - 하나의 문단으로 작성합니다.
      - project.name과 project.background가 모두 비어 있으면 content_html을 빈 문자열로 출력합니다.

  problem:
    title: 핵심 목표
    output_key: problem
    source_fields:
      - project.name
      - project.background
      - project.problem
      - project.problem_items
      - project.goals
    rules:
      - 프로젝트가 궁극적으로 해결하려는 목적을 하나의 핵심 목표로 작성합니다.
      - 단순히 문제를 다시 나열하지 않습니다.
      - project.problem과 project.problem_items에서 해결 대상을 확인합니다.
      - project.goals가 있으면 전체 목표를 포괄하는 상위 목표로 정리합니다.
      - project.goals가 없으면 확인된 문제를 해결하려는 방향으로 작성합니다.
      - 세부 기능명, 기술 스택, 일정, 담당자 정보를 포함하지 않습니다.
      - 입력에 없는 성과 수치나 사업 효과를 추가하지 않습니다.
      - 하나의 문단으로 작성합니다.
      - 한 문장 또는 두 문장으로 작성합니다.
      - 확인할 수 있는 문제나 목표가 없으면 content_html을 빈 문자열로 출력합니다.

  users:
    title: 대상 사용자
    output_key: users
    source_fields:
      - users
    rules:
      - 각 사용자의 type, description, needs를 사용합니다.
      - 사용자가 여러 명이면 사용자별로 구분합니다.
      - requirements나 decisions에만 있는 내용을 사용자의 요구로 추가하지 않습니다.
      - needs가 비어 있으면 요구사항을 임의로 생성하지 않습니다.
      - users가 비어 있으면 content_html을 빈 문자열로 출력합니다.

detailed_goal_rules:
  title: 세부 목표 및 문제 정의
  output_field: goals
  source_fields:
    - project.problem
    - project.problem_evidence
    - project.problem_evidence_status
    - project.problem_items
    - project.goals
    - requirements.functional
    - decisions

  item_fields:
    - title
    - problem
    - goal
    - problem_evidence
    - goal_evidence

  count:
    minimum: 0
    maximum: 4

  rules:
    - project.goals의 존재 여부와 관계없이 세부 목표 항목 구성을 시도합니다.
    - 각 항목은 서로 관련된 문제와 목표를 하나의 쌍으로 구성합니다.
    - 문제 하나에 여러 목표가 직접 연결되면 하나의 항목으로 합칠 수 있습니다.
    - 서로 다른 문제를 하나의 항목에 무리하게 합치지 않습니다.
    - 같은 문제나 목표를 여러 항목에서 반복하지 않습니다.
    - 문제와 목표의 연결 관계를 입력에서 확인하기 어려우면 해당 항목을 생성하지 않습니다.
    - 문제 근거와 목표 근거를 모두 확보할 수 있는 항목만 출력합니다.
    - 최대 4개까지만 출력합니다.
    - 출력 순서는 회의록에서 중요하게 논의된 순서를 따릅니다.
    - 일정, 담당자, 기술 스택만으로 세부 목표를 만들지 않습니다.

  title_rules:
    - 문제와 목표를 함께 대표하는 짧은 이름을 작성합니다.
    - 30자 이내로 작성합니다.
    - 문장 앞에 번호를 넣지 않습니다.
    - 문장 앞에 하이픈이나 글머리 기호를 넣지 않습니다.
    - 문제 또는 목표라는 접두어를 넣지 않습니다.
    - 입력에 없는 사업 효과를 제목에 추가하지 않습니다.

  problem_rules:
    preferred_sources:
      - project.problem_items
      - project.problem
    rules:
      - 해결해야 하는 현재 상태나 불편을 한 문장으로 작성합니다.
      - 기능이나 해결 방법을 문제 문장에 포함하지 않습니다.
      - project.problem_items가 있으면 개별 문제를 우선 사용합니다.
      - project.problem_items가 없을 때만 project.problem을 사용합니다.
      - 원인과 결과가 별도 problem_items로 분리됐지만 하나의 문제 흐름이면 한 문장으로 합칠 수 있습니다.
      - 입력에 없는 원인, 영향, 수치 또는 사용자를 추가하지 않습니다.
      - 문장은 평서형인 한다 체로 작성합니다.

  goal_rules:
    preferred_sources:
      - project.goals
      - requirements.functional
      - decisions.category=feature
    rules:
      - 해당 문제를 해결하거나 개선하려는 상태를 한 문장으로 작성합니다.
      - project.goals에서 직접 연결되는 목표를 우선 사용합니다.
      - 직접 연결되는 project.goals가 없으면 기능 요구사항이나 기능 결정을 사용하여 목표를 구성할 수 있습니다.
      - 기능 요구사항을 그대로 복사하지 않고 기능을 통해 개선하려는 상태로 작성합니다.
      - 입력에서 확인할 수 없는 성과나 기대 효과를 추가하지 않습니다.
      - 기술 스택, 일정, 담당자 또는 작업 기한을 목표로 작성하지 않습니다.
      - 문장은 평서형인 한다 체로 작성합니다.

  evidence_rules:
    - problem_evidence에는 문제 작성에 사용한 근거를 하나 이상 포함합니다.
    - goal_evidence에는 목표 작성에 사용한 근거를 하나 이상 포함합니다.
    - problem_evidence는 project.problem_evidence 또는 project.problem_items의 evidence에서 가져옵니다.
    - goal_evidence는 project.goals, requirements.functional 또는 feature 범주의 decisions에서 가져옵니다.
    - evidence_status가 verified인 근거만 사용합니다.
    - quote는 입력 JSON의 quote를 그대로 복사합니다.
    - quote의 띄어쓰기, 문장부호 또는 표현을 수정하지 않습니다.
    - 입력 JSON에 존재하지 않는 quote를 생성하지 않습니다.
    - 문제 근거와 목표 근거 중 하나라도 없으면 해당 세부 목표 항목을 출력하지 않습니다.

feature_rules:
  title: 주요 기능
  output_field: features
  source_fields:
    - requirements.functional
    - decisions.category=feature

  count:
    minimum: 0
    preferred_minimum: 3
    maximum: 7

  rules:
    - 주요 기능은 sections가 아니라 features 배열에 출력합니다.
    - sections에 key가 features인 항목을 만들지 않습니다.
    - requirements.functional과 feature 범주의 decisions에서 검증된 정보만 사용합니다.
    - 기능 정보가 전혀 없을 때만 빈 배열로 출력합니다.
    - 입력에서 확인된 서로 다른 주요 기능을 누락하지 않습니다.
    - 원본 기능이 3개보다 적으면 개수를 억지로 늘리지 않습니다.
    - 최대 7개를 넘지 않습니다.

    - 입력에서 상위 기능과 세부 동작의 관계를 확인할 수 있으면 하나의 기능으로 묶습니다.
    - 세부 동작을 묶을 때는 내용을 삭제하지 않고 상위 기능의 description에 포함합니다.
    - 계산 기준, 입력 데이터, 적용 대상 및 필수 조건을 단순한 효과 문장으로 바꾸어 생략하지 않습니다.
    - 기능 사이의 관계가 입력에 없으면 일반적인 서비스 구성을 근거로 임의로 연결하지 않습니다.

    - 특정 기능 목록의 개수와 문서 전체의 출력 항목 수를 동일하게 취급하지 않습니다.
    - 검증된 입력에 별도 외부 연동이 있으면 기능 목록의 개수를 맞추기 위해 연동을 삭제하지 않습니다.
    - 별도 연동은 연결 대상이 명확히 드러나는 독립 항목으로 작성할 수 있습니다.
    - 외부 연동이 다른 섹션에 나온다는 이유만으로 주요 기능에서 제외하지 않습니다.

    - 기능 제공 방식과 호환성 조건이 해당 기능에 연결되어 있으면 description에 보존합니다.
    - 같은 기능의 구현 방식이나 호환성 대응을 별도의 상위 기능으로 중복 생성하지 않습니다.
    - 제외되거나 대체된 기능을 현재 제공하는 기능으로 작성하지 않습니다.

  title_rules:
    - 30자 이내로 작성합니다.
    - 사용자가 이해할 수 있는 기능명으로 작성합니다.
    - 구현 방법, 기술 스택 또는 내부 처리 구조를 기능명에 넣지 않습니다.
    - 별도 연동 항목은 입력에서 확인된 연동 대상을 제목에 명시합니다.
    - 입력에 없는 기능을 만들지 않습니다.

  description_rules:
    - 기능이 무엇인지 1문장에서 3문장으로 설명합니다.
    - requirements.functional과 feature 범주의 decisions에 있는 검증된 내용만 사용합니다.
    - 상위 기능에 연결된 세부 동작과 필수 조건을 함께 설명합니다.
    - 입력에 계산 기간이나 수치가 있으면 그대로 보존합니다.
    - 외부 연동의 대상, 데이터 종류 및 처리 방식은 입력에서 확인되는 범위까지만 설명합니다.
    - 단순히 연동한다고 되어 있으면 자동 동기화, 실시간 처리 또는 양방향 연동이라고 확대하지 않습니다.
    - 이름만 있는 기능은 기능명 수준으로 설명합니다.
    - 대시보드에 표시할 지표, 권한의 종류 또는 관리 화면의 동작을 임의로 추가하지 않습니다.
    - 같은 내용을 반복하여 분량을 늘리지 않습니다.

glossary_rules:
  enabled_when: glossary_text가 비어 있지 않은 경우
  rules:
    - 용어집은 원본 JSON에 등장하는 사내 용어를 설명할 때만 사용합니다.
    - 원본 JSON에 없는 새로운 기능, 정책 또는 요구사항을 추가하지 않습니다.
    - 용어집에 없는 용어의 의미를 추론하지 않습니다.
    - evidence.quote에는 용어집 문장이 아니라 구조화 JSON의 원문 근거를 사용합니다.
    - 용어의 정의를 반영하더라도 원래 의미를 확장하지 않습니다.

regeneration_rules:
  input_fields:
    - structured
    - section_key
    - reject_type
    - comment

  rules:
    - 지정된 서술형 섹션 하나만 출력합니다.
    - 다른 섹션은 수정하지 않습니다.
    - 반려 사유를 반영하되 원본 JSON에 없는 사실은 추가하지 않습니다.
    - 최초 생성과 동일한 섹션별 작성 규칙을 적용합니다.
    - 반려 사유를 전부 반영할 수 있으면 needs_input을 빈 문자열로 출력합니다.
    - 반려 사유를 일부만 반영할 수 있으면 가능한 부분만 수정합니다.
    - 반영하지 못한 요청과 이유를 needs_input에 작성합니다.
    - 반려 사유를 전혀 반영할 수 없으면 기존 내용을 유지합니다.
    - 필요한 추가 정보를 needs_input에 한 문장으로 작성합니다.
    - 문장을 반복하거나 표현만 바꿔 분량을 늘리지 않습니다.