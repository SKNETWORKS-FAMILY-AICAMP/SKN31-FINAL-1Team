decomposition_principles: |
  각 업무는 아래 3원칙을 모두 만족해야 한다. 하나라도 아니면 더 쪼갤 것.
  1. 담당자 1인에게 배정 가능하다.
  2. 완료조건을 한 문장으로 표현할 수 있다.
  3. 산출물이 하나로 특정된다.

