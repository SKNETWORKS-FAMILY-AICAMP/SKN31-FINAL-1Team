          type: "기능"
          priority: "Medium"
          source: "requirement_text"
          review_status: "검토완료"
        - id: "FR-02-003"
          category_1: "직원관리"
          category_2: null
          name: "새 직원 등록"
          description: "이름, 이메일, 연락처 등 항목을 입력하여 신규 직원을 등록한다."
          type: "기능"
          priority: "High"
          source: "requirement_text"
          review_status: "검토완료"
    output:
      by_requirement:
        FR-02-001:
          - task_id: "TASK-001"
            epic_id: "EPIC-001"
            epic_title: "직원 목록 조회 기능"
            title: "상태별 탭 필터 API 구현"
            description: "전체/활성/휴직/퇴사/잠금 상태값으로 직원 목록을 필터링하는 조회 API 구현"
            required_skills: ["Django", "REST API"]
            dependency_task_ids: []
            risk_buffer_factor: 1.2
            feature_area: "직원 목록"
            difficulty: "하"
            difficulty_reason: "상태값 기준 단순 조건 필터링만 필요해 판단 로직이 간단함"
            source_req_id: "FR-02-001"
            subtasks: []
