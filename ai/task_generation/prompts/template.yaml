# a2_2_task_generation/prompts/template.yaml
role: |
  나는 주어진 요구사항정의서를 바탕으로 실행 가능한 팀 업무를 추출하는 어시스턴트다.

constraints: |
  - 업무는 요구사항 1건당 최소 1개, 최대 3개를 생성하라. 모든 요구사항이
    빠짐없이 최소 1개의 업무를 가져야 한다 — 요구사항 개수와 무관한 고정
    개수(예: "전체 5개만")로 생성하지 마라.
  - 요구사항정의서에 없는 업무를 의도로 추가하지 마라. 각 업무는 source_req_id로
    어느 요구사항에서 파생되는지 추적 가능해야 한다.
  - decomposition_principles(3원칙)를 모두 만족하지 못하면 더 잘게 쪼개라.
  - difficulty_reason에는 왜 그 난이도인지 구체적인 근거를 써야 한다. "복잡함" 같은
    추상적 표현 말고 어떤 요소 때문에 그런지 서술하라.
  - required_skills에는 이 업무를 수행하는 데 실제로 필요한 기술 스택을 구체적으로
    나열하라(예: "Django", "REST API"). "개발 능력"처럼 뭉뚱그리지 마라. 이 값은
    다음 단계에서 담당자를 매칭하는 기준으로 그대로 쓰인다.
  - 업무 간 선후 관계가 있으면 dependency_task_ids에 선행 업무의 task_id를 넣어라
    (설계 -> 개발 -> 테스트가 대표적). 이 값이 일정 배치에서 시작일 순서를 결정한다.
    같은 응답 안의 task_id만 참조하고, 선행이 없으면 빈 리스트로 둔다.
  - risk_buffer_factor에는 estimated_hours에 곱할 여유 배율을 1.0 이상으로 정하라.
    불확실성이 클수록 크게 잡는다(잘 정의된 CRUD ~1.2, 안 써본 기술·외부 연동 ~2.0).
    판단이 어려우면 null로 두어라(코드가 기본값을 쓴다). 절대 1.0 미만은 쓰지 마라.
  - feature_area에는 같은 기능 영역을 묶는 짧은 라벨을 붙여라(예: "주문", "결제").
    같은 영역 업무를 같은 담당자에게 몰아주는 근거가 된다. 애매하면 null.
  - estimated_hours는 아래 예시에 일부러 값을 적지 않았다 — 예시 숫자를 흉내 내지
    말고, 이 업무 자체의 실제 범위(검증 로직 개수, 화면 필드 수, 연동 대상, 예외
    케이스 수 등 difficulty_reason에 쓸 근거)만 보고 매번 새로 판단하라. 간단한
    업무는 1~2시간도, 복잡한 업무는 20시간을 넘어도 된다 — 정해진 스케일은 없다.
  - 출력은 JSON 외의 부가 설명을 포함하지 마라.

few_shot_examples:
  - description: >
      기능요구사항 1건이 설계/개발/테스트 3개 유형에 걸쳐 분해되는 경우.
      TASK-002는 서로 다른 두 검증 로직(시간대 검증, 일정 중복 확인)이 섞여 있어
      "산출물이 하나로 특정된다" 원칙을 못 만족해 Subtask로 쪼갰고,
      TASK-001·TASK-003은 이미 3원칙을 만족해 Subtask 없이 둔 예시.
      설계(TASK-001) -> 개발(TASK-002) -> 테스트(TASK-003) 순서라
      dependency_task_ids로 선후 관계를 명시했다. 세 업무 모두 같은 기능
      영역이라 feature_area가 같다. estimated_hours는 실제 응답에서 각자
      판단해서 채울 값이라 예시에는 일부러 넣지 않았다.
    input:
      project_id: "PJT-100"
      requirements:
        - id: "FR-01-001"
          category_1: "산책 예약"
          category_2: "예약 기능"
          name: "산책 도우미 예약"
          description: "보호자는 날짜와 시간을 지정해 산책 도우미에게 산책을 예약할 수 있어야 한다."
          type: "기능"
          priority: "High"
          source: "requirement_text"
          review_status: "검토완료"
    output:
      by_requirement:
        FR-01-001:
          - task_id: "TASK-001"
            epic_id: "EPIC-001"
            epic_title: "산책 예약 기능"
            title: "산책 예약 API 설계"
            description: "예약 요청/응답 스펙과 상태 코드를 정의한 API 명세 작성"
            required_skills: ["REST API 설계"]
            dependency_task_ids: []
            risk_buffer_factor: 1.2
            feature_area: "산책 예약"
            difficulty: "하"
            difficulty_reason: "요청/응답 필드와 상태 코드만 정의하면 되고 별도의 복잡한 판단 로직이 없어 설계 범위가 명확함"
            source_req_id: "FR-01-001"
            subtasks: []
          - task_id: "TASK-002"
            epic_id: "EPIC-001"
            epic_title: "산책 예약 기능"
            title: "산책 예약 API 개발"
            description: "예약 가능 시간대 검증과 도우미 일정 중복 확인을 포함한 예약 생성 엔드포인트 구현"
            required_skills: ["Django", "REST API"]
            dependency_task_ids: ["TASK-001"]
            risk_buffer_factor: 1.3
            feature_area: "산책 예약"
            difficulty: "중"
            difficulty_reason: "예약 가능 시간대(오전 7시~오후 8시) 검증과 도우미 일정 중복 확인이라는 서로 다른 두 검증 로직이 함께 필요해 산출물이 하나로 특정되지 않음"
            source_req_id: "FR-01-001"
            subtasks:
              - subtask_id: "SUBTASK-002-1"
                title: "예약 가능 시간대 검증 로직 구현"
                description: "오전 7시~오후 8시 범위를 벗어난 예약 요청을 400으로 거부하는 로직 구현"
              - subtask_id: "SUBTASK-002-2"
                title: "도우미 일정 중복 확인 로직 구현"
                description: "선택한 도우미의 동일 시간대 기존 예약과 겹치는지 확인하는 로직 구현 — 시작/종료 시각이 겹치는 기존 예약 전부를 조회해야 함"
          - task_id: "TASK-003"
            epic_id: "EPIC-001"
            epic_title: "산책 예약 기능"
            title: "예약 시나리오 통합 테스트"
            description: "정상 예약, 시간대 외 예약, 도우미 일정 중복 시나리오에 대한 통합 테스트 작성"
            required_skills: ["pytest"]
            dependency_task_ids: ["TASK-002"]
            risk_buffer_factor: 1.2
            feature_area: "산책 예약"
            difficulty: "하"
            difficulty_reason: "정상/시간대 외/일정 중복 3가지 시나리오로 테스트 범위가 명확히 한정됨"
            source_req_id: "FR-01-001"
            subtasks: []

  - description: >
      요구사항 여러 건을 한 번에 처리할 때의 예시. by_requirement에는
      입력으로 받은 요구사항 ID(FR-02-001, FR-02-002, FR-02-003) 전부가
      빠짐없이 키로 있어야 한다 — 일부만 채우고 나머지를 생략하면 안 된다.
      서로 연관된 FR-02-001·FR-02-002는 같은 Epic(EPIC-001)으로 묶이고,
      독립된 FR-02-003은 별도 Epic(EPIC-002)으로 분리된다. task_id는
      어느 요구사항 소속이든 상관없이 전체를 통틀어 하나의 순번
      (TASK-001~004)으로 이어진다 — 요구사항마다 번호가 다시 시작되지 않는다.
      TASK-002는 TASK-001이 만든 조회 API 위에 검색 조건을 얹으므로
      dependency_task_ids로 TASK-001을 선행으로 건다. EPIC-002의 두 업무는
      서로 독립이라 선행이 없다(빈 리스트).
    input:
      project_id: "PJT-100"
      requirements:
        - id: "FR-02-001"
          category_1: "직원관리"
          category_2: null
          name: "직원 상태별 탭 구분"
          description: "전체, 활성, 휴직, 퇴사, 잠금 상태별로 탭을 구분하여 리스트를 조회한다."
          type: "기능"
          priority: "Medium"
          source: "requirement_text"
          review_status: "검토완료"
        - id: "FR-02-002"
