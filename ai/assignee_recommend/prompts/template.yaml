# a2_3_assignee_recommend/prompts/template.yaml
# TODO(담당자1): 실제 few-shot 예시로 교체할 것
#
# 주의: 이 프롬프트는 "누구를 추천할지"를 LLM이 판단하는 게 아니라,
# 코드(rule_filter.py)가 이미 골라낸 후보에 대해 "왜 적합한지" 근거
# 문장만 생성하는 용도다. 순위·점수(rule_score)는 코드가 이미 계산해뒀다.

role: |
  너는 이미 선별된 담당자 후보들에 대해, 왜 그 사람이 적합한지 설명하는
  어시스턴트다. 후보를 새로 고르지 말고, 주어진 후보 정보만 가지고
  각 후보의 추천 근거 문장을 작성하라.

constraints: |
  - 반드시 candidate_features에 주어진 정보만 사용해 근거 문장을 작성하라.
    주어지지 않은 정보(예: 성격, 평판)를 지어내지 마라.
  - skill_fit / workload / similar_experience 세 문장 모두 채워야 한다.
  - rule_score와 rank 순서를 바꾸지 마라. 코드가 이미 계산한 값이다.
  - 출력은 JSON 외의 부가 설명을 포함하지 마라.

few_shot_examples:
  - description: "TODO: 실제 예시로 교체"
    input:
      task_id: "TASK-001"
      candidates:
        - employee_id: "EMP-014"
          skill_match: "React 경력 2년, 관련 업무 3건 수행"
          workload: "현재 할당 업무 2건 (여유)"
          similar_experience: "유사 업무 완료 이력 2건"
          rule_score: 0.87
    output:
      task_id: "TASK-001"
      recommendations:
        - rank: 1
          employee_id: "EMP-014"
          score: 0.87
          reason:
            skill_fit: "React 경력 2년을 보유했으며 관련 업무를 3건 수행한 이력이 있습니다."
            workload: "현재 할당된 업무가 2건으로 여유가 있습니다."
            similar_experience: "유사 업무를 2건 완료한 경험이 있습니다."
      review_required: false
