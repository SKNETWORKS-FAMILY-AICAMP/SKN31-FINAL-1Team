metadata:
  version: "2.0"
  owner: "AI 회의록 구조화 담당"
  updated_at: "2026-09-11"
  purpose: "회의록 구조화 모델의 입력 및 출력 예시"

examples:
  - id: meeting_scope
    purpose: "기능, 제외 범위, 일정 제약과 개별 문제 추출"

    input: |
      [회의 기본정보]
      일시: 2026-03-04
      참석자: 김기획, 박개발
      회의명: 회의록 자동화 범위 확정

      [회의 목적]
      회의록 자동화 기능의 범위를 확정한다.

      [회의 내용]
      서기가 회의록을 직접 텍스트로 입력하는 방식으로 간다.
      음성 녹음 인식은 정확도 문제도 있고 개발 기간이 8주밖에 안 되니 이번엔 뺀다.
      입력은 최소 항목만 받자. 기본정보, 목적, 내용, 결정사항 네 개.
      서기 부담이 크면 아무도 안 쓴다.

      [최종 결정사항]
      회의록 입력은 텍스트 방식으로 한다.
      음성 인식은 이번 범위에서 제외한다.

    output:
      project:
        name: "회의록 자동화 기능"
        background: "회의록 작성 부담으로 인해 실제 사용이 저조할 수 있다는 문제 인식"
        problem: "서기의 입력 부담이 커 회의록 사용이 저조해질 수 있다"

        problem_items:
          - content: "서기의 회의록 입력 부담이 크다"
            evidence:
              quote: "서기 부담이 크면 아무도 안 쓴다"

        goals:
          - content: "서기가 최소 항목만 입력해도 동작하는 회의록 입력 방식을 확보한다"
            evidence:
              quote: "입력은 최소 항목만 받자. 기본정보, 목적, 내용, 결정사항 네 개."

        background_evidence:
          quote: "서기 부담이 크면 아무도 안 쓴다"

        problem_evidence:
          quote: "서기 부담이 크면 아무도 안 쓴다"

      users:
        - type: "서기"
          description: "회의 내용을 직접 텍스트로 입력하는 담당자"
          needs:
            - "입력 항목이 적을 것"
          evidence:
            quote: "서기가 회의록을 직접 텍스트로 입력하는 방식으로 간다"

      requirements:
        functional:
          - content: "회의록을 텍스트로 입력받는다"
            feature_name: "회의록 텍스트 입력"
            evidence:
              quote: "서기가 회의록을 직접 텍스트로 입력하는 방식으로 간다"

          - content: "입력 항목은 기본정보, 목적, 내용, 결정사항 4개로 한정한다"
            feature_name: "회의록 텍스트 입력"
            evidence:
              quote: "기본정보, 목적, 내용, 결정사항 네 개"

        non_functional: []
        data: []
        technical: []

      scenarios: []

      decisions:
        - category: "feature"
          content: "회의록 입력은 텍스트 방식으로 한다"
          rationale: "음성 인식은 정확도 문제와 일정 제약이 있음"
          evidence:
            quote: "회의록 입력은 텍스트 방식으로 한다"

        - category: "scope"
          content: "음성 인식은 이번 범위에서 제외한다"
          rationale: "정확도 문제와 8주 일정 제약"
          evidence:
            quote: "음성 인식은 이번 범위에서 제외한다"

      constraints:
        - type: "일정"
          content: "개발 기간 8주"
          evidence:
            quote: "개발 기간이 8주밖에 안 되니"

      unresolved:
        - "비기능 요구사항이 회의에서 논의되지 않았습니다."
        - "사용자 시나리오가 회의에서 구체적으로 언급되지 않았습니다."
        - "데이터 저장 방식이 논의되지 않았습니다."

  - id: decided_and_deferred
    purpose: "결정된 내용과 추후 확정할 내용을 분리"

    input: |
      [회의 기본정보]
      일시: 2026-04-02
      참석자: 이기획, 최개발
      회의명: 배송비 정책 확정

      [회의 목적]
      지역별 배송비 정책을 확정한다.

      [회의 내용]
      원거리 지역은 배송비를 추가로 부과한다.
      다만 추가 요금이 정확히 얼마일지는 물류팀 견적을 받아봐야 해서 다음 회의에서 정하기로 했다.
      결제 수단은 카드와 계좌이체만 우선 지원한다.

      [최종 결정사항]
      원거리 지역은 배송비를 추가 부과한다. 구체 금액은 차주 회의에서 확정한다.
      결제 수단은 카드와 계좌이체로 한정한다.

    output:
      project:
        name: "배송비 정책"
        background: "원거리 지역에 추가 배송비를 부과하는 정책을 정리할 필요가 있다"
        problem: "원거리 지역의 추가 배송비 금액이 아직 정해지지 않았다"

        problem_items:
          - content: "원거리 지역의 추가 배송비 금액이 정해지지 않았다"
            evidence:
              quote: "구체 금액은 차주 회의에서 확정한다."

        goals:
          - content: "지역별 배송비 부과 기준을 확정한다"
            evidence:
              quote: "지역별 배송비 정책을 확정한다."

        background_evidence:
          quote: "원거리 지역은 배송비를 추가로 부과한다."

        problem_evidence:
          quote: "구체 금액은 차주 회의에서 확정한다."

      users: []

      requirements:
        functional:
          - content: "결제는 카드와 계좌이체 방식만 지원한다"
            feature_name: "결제 수단 지원"
            evidence:
              quote: "결제 수단은 카드와 계좌이체만 우선 지원한다."

        non_functional: []
        data: []
        technical: []

      scenarios: []

      decisions:
        - category: "feature"
          content: "원거리 지역은 배송비를 추가로 부과한다"
          rationale: "원거리 지역의 배송 비용을 반영하기 위함"
          evidence:
            quote: "원거리 지역은 배송비를 추가로 부과한다."

        - category: "scope"
          content: "결제 수단은 카드와 계좌이체로 한정한다"
          rationale: "우선 지원 범위를 한정하기 위함"
          evidence:
            quote: "결제 수단은 카드와 계좌이체로 한정한다."

      constraints: []

      unresolved:
        - "원거리 지역 추가 배송비의 구체적인 금액이 정해지지 않았습니다."
