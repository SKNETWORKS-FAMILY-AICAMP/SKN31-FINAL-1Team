# ============================================================================
# nfr_checklist.yaml
# 표준 비기능요구사항(NFR) 체크리스트 — ISO/IEC 25010 기반
# 사용 에이전트: A2-1 (요구사항정의서 초안 생성)
# ============================================================================
#
# [사용법 — 이 파일을 프롬프트에 로드하는 쪽(A2-1)이 반드시 지켜야 할 규칙]
#
# 1. generation_mode: "baseline"
#    trigger_hint 매칭 여부와 무관하게, 기획서 도메인에 맞춰 일반적인 수준의
#    요구사항을 최소 1건 생성한다. 되돌리기 어려운 리스크(보안 사고, 데이터
#    유실 등)와 직결되는 카테고리만 baseline으로 지정되어 있다.
#
# 2. generation_mode: "conditional"
#    trigger_hint에 해당하는 내용이 기획서(requirements)에 실제로 있을 때만
#    요구사항을 생성한다. 해당 없으면 생성하지 않는다 — 과잉 생성 금지.
#
# 3. example은 "출력 형식·구체성 수준"만 보여주는 도메인 중립적 참고자료다.
#    실제 name/description 내용은 반드시 입력된 기획서 내용에서 가져올 것.
#    example의 문구를 그대로 베끼거나 example 속 수치를 그대로 쓰지 말 것.
#
# 4. baseline으로 생성한 요구사항은 출력 시 다음 두 필드를 반드시 포함한다.
#      source: "baseline_default"   (기획서 원문 근거 없이 표준값으로 생성됨)
#      review_status: "검토대기"     (PM의 명시적 확인 필요)
#    conditional로 생성한 요구사항은 다음을 포함한다.
#      source: "requirement_text"   (기획서 원문에서 직접 도출됨)
#
# 5. category_2 / category_3(세부 분류)는 비기능요구사항에서는 비워도 된다.
#    (FR은 대·중·소 3단계, NFR은 이 체크리스트의 category_1 한 단계까지만
#    채우는 것이 원칙 — 상세 이유는 팀 논의 기록 참고)
#
# 6. "기능 적합성(Functional Suitability)"은 ISO 25010 8개 특성 중 하나이지만
#    이 체크리스트에는 포함하지 않는다 — 그 영역은 FR(기능요구사항)이 담당.
#
# ============================================================================

standard_categories:

  # ---- baseline: 언급 없어도 항상 최소 1건 생성 (되돌리기 어려운 리스크) ----

  - id: "security"
    name_kr: "보안성"
    iso25010_ref: "Security"
    sub_characteristics: ["기밀성", "무결성", "부인방지", "책임추적성", "인증성"]
    generation_mode: "baseline"
    trigger_hint: "로그인, 권한, 개인정보, 외부 API 키, 결제 언급 시 더 구체화"
    example:
      name: "사용자 인증 및 접근 권한 제어"
      description: "인증된 사용자만 시스템 기능에 접근할 수 있으며, 역할(관리자/일반 사용자 등)에 따라 기능 및 데이터 접근 권한을 다르게 제어해야 한다."

  - id: "reliability"
    name_kr: "신뢰성"
    iso25010_ref: "Reliability"
    sub_characteristics: ["성숙성", "가용성", "결함허용성", "복구성"]
    generation_mode: "baseline"
    trigger_hint: "장애 대응, 백업, 데이터 유실 방지, 트랜잭션 언급 시 더 구체화"
    example:
      name: "데이터 무결성 및 복구 보장"
      description: "핵심 데이터 처리 중 오류가 발생해도 부분 저장이나 데이터 유실이 없어야 하며, 장애 발생 시 최근 백업 시점으로 신속히 복구할 수 있어야 한다."

  # ---- conditional: 기획서에 관련 언급이 있을 때만 생성 ----

  - id: "performance_efficiency"
    name_kr: "성능 효율성"
    iso25010_ref: "Performance Efficiency"
    sub_characteristics: ["시간반응성", "자원활용성", "용량"]
    generation_mode: "conditional"
    trigger_hint: "응답속도, 대용량 처리, 동시접속, 트래픽, 실시간 언급 시 검토"
    example:
      name: "주요 화면 응답 속도"
      description: "핵심 조회 및 검색 기능은 일정 시간 이내에 결과를 표시해야 하며, 동시 사용자가 몰리는 상황에서도 성능 저하가 크지 않아야 한다."

  - id: "compatibility"
    name_kr: "호환성"
    iso25010_ref: "Compatibility"
    sub_characteristics: ["공존성", "상호운용성"]
    generation_mode: "conditional"
    trigger_hint: "외부 시스템 연동, 타사 서비스 연결, 브라우저/OS 다양성 언급 시 검토"
    example:
      name: "외부 시스템 연동 호환성"
      description: "타 시스템과 데이터를 주고받을 때 표준 데이터 형식 및 인터페이스를 지원하여 상호 운용이 가능해야 한다."

  - id: "usability"
    name_kr: "사용성"
    iso25010_ref: "Usability"
    sub_characteristics: ["인식용이성", "학습성", "조작성", "접근성"]
    generation_mode: "conditional"
    trigger_hint: "UI/UX, 접근성, 반응형, 사용자 편의성, 키보드 조작 언급 시 검토"
    example:
      name: "접근성 및 브라우저 호환성"
      description: "주요 기능은 키보드만으로도 조작 가능해야 하며, 최신 버전의 주요 브라우저에서 동일하게 동작해야 한다."

  - id: "maintainability"
    name_kr: "유지보수성"
    iso25010_ref: "Maintainability"
    sub_characteristics: ["모듈성", "재사용성", "분석용이성", "수정용이성", "시험용이성"]
    generation_mode: "conditional"
    trigger_hint: "로깅, 모니터링, 코드 구조, 향후 기능 확장 가능성 언급 시 검토"
    example:
      name: "운영 로그 기록 및 추적"
      description: "주요 기능의 오류 발생 및 사용자 행위는 추적 가능한 형태로 로깅되어야 하며, 문제 발생 시 원인 분석이 용이해야 한다."

  - id: "portability"
    name_kr: "이식성"
    iso25010_ref: "Portability"
    sub_characteristics: ["적응성", "설치성", "대체성"]
    generation_mode: "conditional"
    trigger_hint: "인프라 이전, 클라우드 변경, 배포 환경 다양화 언급 시 검토"
    example:
      name: "배포 환경 이식성"
      description: "특정 인프라 환경에 종속되지 않고, 필요 시 다른 클라우드 환경으로 이전하여 운영할 수 있어야 한다."

  # ---- 프로젝트 고유 확장 카테고리 (ISO 25010 표준 범위 밖) ----

project_specific_categories:

  - id: "ai_specific"
    name_kr: "AI 기능 및 연동 특화"
    iso25010_ref: null   # 표준 범위 밖 — AI 프로덕트 특성상 자체 추가한 카테고리
    sub_characteristics: ["처리상태 표시", "승인절차", "근거기반 결과"]
    generation_mode: "conditional"
    trigger_hint: "AI 자동생성, AI 추천, AI 분석, LLM 연동 기능 언급 시 반드시 검토"
    example:
      name: "AI 처리 상태 표시 및 결과 승인"
      description: "AI가 생성하거나 추천한 결과는 처리 진행 상태를 사용자에게 표시하며, 담당자의 명시적인 검토와 승인을 거친 뒤에만 시스템에 반영되어야 한다."
