# ============================================================================
# scope_guardrails.yaml
# 범위·권한·미정 스펙 관련 일반 규칙 — A2-1(요구사항정의서 초안 생성)
# ============================================================================
#
# [배경]
# 기존 constraints 프로즈에는 "재고관리" 프로젝트의 실제 사례(직원 입출고
# 등록, 평균 판매량 추천 산식, 거래처 관리)가 모든 프로젝트에 적용되는 일반
# 규칙과 뒤섞여 원문 그대로 박혀 있었다. 도메인 어휘가 일반 규칙에 노출되면
# 무관한 프로젝트에서도 모델이 그 어휘·구조에 낚여 없는 내용을 재고관리
# 사례와 비슷하게 만들어낼 위험이 있다(2026-09-15, 프롬프트 구조화 작업 중
# 분리). 아래는 일반 규칙(rule/action)과 예시(example_domain)를 명확히
# 분리한다 — example_domain은 "재고관리 프로젝트에서는 이렇게 적용된 사례"일
# 뿐, 다른 프로젝트에 그 문구를 그대로 복사할 근거가 아니다.
# ============================================================================

guardrails:
  - id: "role_permission_no_expansion"
    rule: >
      역할별 수행 업무 중 일부만 원문에 명시된 경우, 명시되지 않은 나머지
      권한을 전부 금지 또는 전부 허용으로 확대 해석하지 않는다. 기능요구사항
      (FR)의 권한 관리와 비기능요구사항(NFR)의 접근 통제 모두 동일하게
      적용한다.
    action: >
      명시되지 않은 권한은 각각 후속 확정으로 기록한다. 허용/거부는 승인된
      권한표에 따라 검증하며, 미정 권한은 승인도 금지도 확정하지 않는다.
    example_domain: >
      재고관리 — 직원이 '입출고 등록 정도를 수행한다'고만 명시된 경우, 재고
      조회·발주 판단·승인 권한은 후속 확정으로 남긴다(전부 금지도, 전부
      허용도 아님).

  - id: "undefined_business_rule_no_invention"
    rule: >
      집계 단위·산식·반올림 방식·경계값·판정 시점·수신자·채널 등 세부
      비즈니스 스펙이 원문에 없으면 임의로 기본값을 만들어내지 않는다.
    action: >
      acceptance_criteria와 note에 '후속 확정 필요'로 연결한다.
    example_domain: >
      재고관리 — 평균 판매량 기반 추천의 집계 단위·산식·반올림·4주 미만
      데이터 처리, 발주서 필드, 알림의 경계값·판정 시점·수신자·채널이
      원문에 없으면 후속 확정으로 남긴다.

  - id: "name_only_feature_no_design_invention"
    rule: >
      기능명만 있고 세부 동작이 명시되지 않은 경우, DB 작업이나 표시 지표를
      임의로 확정하지 않는다. 서버 권한 검증·원자성·멱등성 등 원문에 없는
      설계는 유용해도 확정 요구와 섞지 않는다.
    action: >
      source를 baseline_default, review_status를 검토대기로 분리하고
      note에 '추가 도출 제안·승인 필요'라고 명시한다.
    example_domain: >
      재고관리 — '거래처 관리', '대시보드'처럼 기능명만 있는 경우.

  - id: "excluded_scope_no_reverse_requirement"
    rule: >
      매출 예측 제외·연동 대상 한정·2차 이관·사용자 제외·확정 기술 스택·
      변경 조건처럼 범위 밖으로 확정된 내용을 거꾸로 요구사항으로 만들지
      않는다.
    action: >
      해당 항목은 note에 범위 제약으로 보존만 하고, 새 구현 요구를 생성하지
      않는다.
    example_domain: >
      재고관리 — final_decisions에 [범위] 태그로 '매출 예측 제외'가 명시된
      경우, 매출 예측 관련 FR을 만들지 않는다.

  - id: "cross_field_feature_derivation"
    rule: >
      key_features(주요 기능)에 이름이 없어도, target_users의 구체적 사용자
      행동 묘사나 tech_stack/데이터 요구의 구체적 설계 내용, final_decisions의
      [기능]/[기술] 태그 항목에 실행 가능한 기능·기술 내용이 있으면 그 자체로
      새 FR/NFR을 도출할 근거가 된다. key_features 목록에 없다는 이유만으로
      건너뛰지 않는다.
    action: >
      해당 근거 필드(target_users/tech_stack/final_decisions 등)를
      related_feature와 note에 명시하고, key_features에는 없었다는 점도
      note에 남겨 PM이 기획서 갱신 필요 여부를 판단할 수 있게 한다.
    example_domain: >
      재고관리 — key_features에는 "바코드 입출고 등록"만 있지만 target_users에
      "사장은 앱 최초 실행 시 온보딩 화면을 보고, 이후에는 바로 로그인 화면으로
      진입한다"는 구체적 행동이 있으면, key_features에 없어도 이를 근거로
      "초기 진입 화면 분기" FR을 별도로 도출한다.

  - id: "operational_admin_capability"
    rule: >
      배치/파이프라인 기능(수집·분석·집계 등)에서 조정 가능한 파라미터
      (채널 목록, 수집 주기, 키워드/제외 목록, 임계값 등)가 언급되면,
      그 파라미터를 운영자가 변경할 수 있는 CRUD 기능과, 파이프라인을
      수동으로 재실행·트리거할 수 있는 운영 기능이 암묵적으로 필요하다.
      key_features에 "관리 화면"이라는 말이 없어도 이 두 가지는 빠뜨리지
      않는다. target_users에 여러 사용자 유형(운영자/리서처/일반사용자 등)이
      나열되어 있으면, 각 유형별로 최소 1개의 조회·이용 FR이 있는지 확인한다.
    action: >
      해당 파라미터·역할이 언급된 필드를 related_feature와 note에 명시하고,
      "운영 설정 CRUD", "파이프라인 수동 트리거/재처리", 누락된 역할의
      "조회/이용 FR"을 각각 도출한다.
    example_domain: >
      재고관리 — "매장별 발주 기준선을 넘으면 알림"처럼 임계값(발주 기준선)이
      언급되면, 그 임계값을 관리자가 조정할 수 있는 CRUD FR도 함께 도출한다.
