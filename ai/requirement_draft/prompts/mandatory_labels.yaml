# ============================================================================
# mandatory_labels.yaml
# note 필드에 쓸 "필수 여부" 3분류 — A2-1(요구사항정의서 초안 생성)
# ============================================================================
#
# 필수 여부와 priority(HIGH/MEDIUM 구현 우선순위)는 서로 다른 축이다.
# 명시된 필수 폴백·디자인 기준은 priority가 MEDIUM이어도 "필수"로 기록한다.
# ============================================================================

labels:
  - state: "explicit_required"
    condition: "원문에 명시된 필수 조건이다 (예: 필수 폴백, 모바일 우선, 폰트/터치/배치 기준)"
    note_label: "필수(우선순위와 별개)"

  - state: "unspecified"
    condition: "원문에 필수 여부가 명시되어 있지 않다"
    note_label: "필수 여부 미확정"

  - state: "ai_suggested"
    condition: "AI가 추가로 도출해 제안한 내용이다 (원문 근거 없음)"
    note_label: "승인 전 적용 여부 미확정"
