# ============================================================================
# fr_decomposition_rules.yaml
# 기능요구사항(FR) 분해 규칙 — A2-1(요구사항정의서 초안 생성)
# ============================================================================
#
# [배경]
# nfr_checklist.yaml은 비기능요구사항이 "독립적으로 시험 가능한 기준마다
# 별도 ID로 분리"되도록 표준 카테고리·트리거를 명시한다. 기능요구사항(FR)
# 쪽에는 이 대칭 규칙이 없어서, key_features의 기능 1건이 그대로 FR 1건으로만
# 매핑되는 경향이 있었다(2026-09-15 확인 — 기획서 기능 개수 = FR 개수로
# 수렴, task_generation이 FR 1건당 최대 3개 Task만 만들 수 있어 하류 Task
# 총량도 함께 눌림).
#
# [사용법 — prompt_builder.py가 지켜야 할 규칙]
# 1. 아래 decomposition_rules는 순서대로 확인한다. 여러 condition에 동시에
#    해당하면 해당하는 조건 수만큼 분리 근거가 생긴 것이므로 그만큼 FR을
#    나눌 수 있다 — 단, 근거 없이 개수만 채우려고 조건을 무리하게 적용하지
#    않는다(맨 아래 note 참고).
# 2. single_atomic_action(마지막 규칙)은 "쪼갤 조건이 없으면 쪼개지 마라"는
#    디폴트다. 이 규칙이 있는 이유: 앞의 4개 규칙만 주면 모델이 매 기능마다
#    무리하게 분리 사유를 찾으려 들 수 있어, "조건 없으면 1개가 정답"이라는
#    출구를 명시적으로 준다.
# 3. example은 형식 참고용이며, 실제 출력에는 입력 기획서의 실제 기능명·
#    조건을 사용한다.
#
# ============================================================================

decomposition_rules:
  - id: "data_lifecycle"
    condition: "기능이 등록/조회/수정/삭제 등 서로 다른 데이터 처리 동작을 함께 포함한다"
    action: "동작(CRUD)별로 별도 FR을 생성한다"
    example: "재고 등록과 재고 수량 조정이 모두 언급되면 등록 FR과 수정 FR을 분리한다"

  - id: "integration_or_fallback"
    condition: "외부 연동, 대체 수단(폴백), 실패 시 처리 경로가 원문에 명시되어 있다"
    action: "주 경로 FR과 폴백·예외 처리 FR을 분리한다"
    example: "카메라 인식이 기본이고 인식 실패 시 수기 입력이 명시되면 인식 등록 FR과 수기 입력 등록 FR로 분리한다"

  - id: "measurable_criteria"
    condition: "독립적으로 구현·시험·완료 판정 가능한 기준(수치·조건)이 하나의 기능 설명 안에 여러 개 있다"
    action: "기준별로 별도 요구사항 ID를 부여한다"
    example: "바코드 인식은 스마트폰 카메라와 iOS ZXing 폴백을 모두 지원해야 한다면, 카메라 인식 FR과 ZXing 폴백 지원 FR로 분리한다"

  - id: "permission_or_role_variant"
    condition: "동일 기능이라도 역할(예: 사장/직원)에 따라 수행 가능한 범위가 다르게 명시되어 있다"
    action: "역할별로 별도 FR을 생성하거나, 하나의 FR 안에서 역할별 범위를 note와 description에 명확히 구분해 기술한다"
    example: "사장은 발주를 승인할 수 있고 직원은 입출고 등록만 할 수 있다면, 두 동작을 하나로 뭉뚱그리지 않고 역할별로 구분해 서술한다"

  - id: "single_atomic_action"
    condition: "위 4개 조건 중 어느 것에도 해당하지 않고, 독립된 동작 하나로 완결된다"
    action: "FR 1건으로 유지한다 — 분리 사유가 없는데 개수를 맞추려 쪼개지 않는다"
    example: "단순 목록 조회 하나만 언급된 기능은 FR 1건으로 충분하다"

note: |
  이 규칙들은 "기능 개수를 부풀리기" 위한 것이 아니다. 분리는 각 FR이
  독립적으로 구현·시험·완료 판정 가능할 때만 유효하다. 원문에 없는 CRUD
  동작·역할·폴백 경로를 지어내어 분리 사유를 만들지 마라. 조건에 해당하는
  근거가 원문에 실제로 있을 때만 분리한다.
