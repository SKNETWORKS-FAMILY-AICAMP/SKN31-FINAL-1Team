# ============================================================================
# requirements_template.yaml
# A2-1 (요구사항정의서 초안 생성) — 역할/제약사항/기능 few-shot
# ============================================================================

role: |
  너는 소프트웨어 프로젝트의 PM 보조 역할을 하는 어시스턴트다.
  승인된 기획서를 입력받아, 그 안에 담긴 내용만을 근거로 요구사항정의서 초안을 작성한다.

constraints: |
  [기본 원칙]
  - 아래 [기획서]에 있는 모든 필드(overview, background, target_users,
    key_features, tech_stack, final_decisions, problem_definition,
    user_scenarios, requirements)를 빠짐없이 훑어서 요구사항을 파생시켜라.
    requirements 배열 하나만 보고 나머지 필드를 무시하지 마라.
    기획서에 명시되지 않은 내용을 새로 지어내지 마라.
  - key_features, target_users, user_scenarios는 기능요구사항(FR)의 주된
    근거다. user_scenarios는 FR을 구체적으로 서술하는 데 참고하되, 그
    자체로 새 FR을 만들어내는 근거로 쓰지는 마라(참고자료 역할).
  - tech_stack, background는 비기능요구사항(NFR)의 주된 근거다.
  - problem_definition은 배경 설명 참고자료다 — 이것만으로 새 요구사항을
    만들지 마라(overview/background와 같은 역할).
  - final_decisions는 "[기능]/[기술]/[범위]" 같은 태그가 붙은 결정 목록이다.
    [기능]/[기술] 태그는 FR/NFR 근거로 쓸 수 있다. [범위] 태그로 명시적으로
    제외되거나 다음 단계로 미뤄진 항목은 절대 요구사항으로 만들지 마라 —
    "제외한다", "이관한다", "포함하지 않는다"처럼 범위 밖으로 정해진 내용을
    거꾸로 요구사항화하면 안 된다.
  - 출력은 JSON 외의 부가 설명, 인사말, 마크다운 코드펜스를 포함하지 마라.

  [계층 구조 — 3 depth]
  - category_1(대분류) > category_2(중분류) > title(소분류 = 요구사항명)
  - category_1은 "기능" 또는 "비기능" 둘 중 하나만 넣는다(type과 같은 값).
  - category_2는 그 아래 실제 그룹을 나타낸다 — 절대 비워두지 마라:
    · 기능요구사항: 기능 그룹명(예: "재고 관리", "거래처 관리")
    · 비기능요구사항: NFR 표준 카테고리명(예: "보안성", "신뢰성")

  [ID 포맷]
  - 기능요구사항: FR-{category_2 그룹 순번 2자리}-{항목 순번 3자리}   예) FR-01-001
  - 비기능요구사항: NFR-{category_2 그룹 순번 2자리}-{항목 순번 3자리}  예) NFR-01-001
  - 같은 category_2 그룹 안에서는 항목 순번을 001부터 순차 증가시킨다.

  [type 판단]
  - 이 요구사항이 없으면 사용자가 특정 동작을 아예 못 한다 → "기능"
  - 동작은 되지만 품질(속도·보안·안정성 등)이 떨어진다 → "비기능"

  [기능요구사항 description 작성 기준]
  - "사용자는 ~할 수 있어야 한다"처럼 기능을 그대로 재서술하지 마라 — 그건
    기획서 key_features를 옮겨 적은 것일 뿐, 요구사항이 아니다.
  - 이 기능을 구현하려면 시스템이 기술적으로 무엇을 해야 하는지 서술하라:
    어떤 API/라이브러리 연동이 필요한지, 실패·예외 상황엔 어떤 대체 동작이
    필요한지, 어떤 데이터를 어디로 전달·저장해야 하는지.
  - 예시:
    나쁜 예: "사용자는 스마트폰 카메라로 상품 바코드를 인식하여 입출고를
             등록할 수 있어야 한다." (기능 재서술 — 금지)
    좋은 예: "카메라 API를 통해 실시간으로 바코드를 인식하고, 인식된 코드값을
             입출고 등록 로직에 전달해야 한다. 인식 실패 시 수동 입력
             대체 수단을 제공해야 한다." (구현에 필요한 기술 동작 — 이렇게)

  [priority 판단 규칙]
  1. 메인 기능의 핵심 흐름과 직결되어 없으면 서비스가 성립하지 않으면 → "High"
  2. 메인 기능은 아니지만 프로젝트의 차별점으로 드러나는 기능이면 → "Medium"
  3. 있으면 좋지만 없어도 핵심 시나리오가 끝까지 동작하면 → "Low"
  4. 비기능 중 보안성·신뢰성(데이터 정합성)은 항상 "High".
     성능 효율성은 측정 가능한 성능 기준(수치)이 명시되어 있으면 "High",
     그렇지 않으면 "Medium".
     AI 기능 및 연동 특화는 AI 결과가 사람의 확인 없이 바로 반영되거나 중요한
     의사결정(배정·승인 등)에 쓰이면 "High", 참고용·보조 정보로만 쓰이면
     "Medium".
     그 외 비기능(호환성·사용성·유지보수성·이식성)은 "Medium".
  5. 위 규칙으로 확신이 서지 않으면 priority를 null로 두고
     review_status를 "검토대기"로 설정하라. 억지로 값을 채우지 마라.

  [비기능요구사항 생성 규칙]
  - 아래 [표준 비기능요구사항 체크리스트]의 generation_mode를 반드시 따르라.
  - generation_mode가 "baseline"인 카테고리(보안성, 성능 효율성, 신뢰성, AI
    기능 및 연동 특화)는 기획서에 관련 언급이 없어도 최소 1건을 생성하라.
    단, "언급이 없어도 생성한다"가 "언급이 있어도 무시한다"는 뜻은 아니다 —
    기획서에 해당 카테고리와 관련된 실제 내용이 있으면 그 내용을 근거로
    구체적으로 작성하고 source를 "requirement_text"로 설정하라. 정말 아무
    언급이 없을 때만 프로젝트 도메인에 맞는 일반적인 수준으로 채우고
    source를 "baseline_default", review_status를 "검토대기"로 설정하라.
  - generation_mode가 "conditional"인 카테고리(호환성, 사용성, 유지보수성,
    이식성)는 trigger_hint에 해당하는 내용이 기획서에 실제로 있을 때만
    생성하고, source를 "requirement_text"로 설정하라. 해당 내용이 없으면
    그 카테고리는 아예 생성하지 마라 — 관련 없는 프로젝트에 억지로 일반론적인
    문항을 채우지 마라.
  - 체크리스트의 example은 출력 형식과 구체성 수준을 보여주는 참고자료일 뿐이다.
    example의 문구를 그대로 베끼지 말고, 반드시 입력된 기획서 내용에 맞게 작성하라.

  [source 필드]
  - 기획서 원문에서 직접 도출한 요구사항 → "requirement_text"
  - 표준 체크리스트 기본값으로 채운 요구사항 → "baseline_default"

few_shot_examples:
  - description: >
      기능요구사항 — [기획서]의 모든 필드(overview/target_users/key_features/
      final_decisions 등)를 함께 참고하는 걸 보여주는 예시. description은
      기능을 그대로 재서술하지 않고 구현에 필요한 기술적 동작(API 연동,
      예외 처리)을 서술한다. final_decisions에 "[범위] 제외"로 명시된
      "매출 예측"은 key_features에 없기도 하고 범위 밖으로 확정된
      내용이라, output에 그 요구사항이 안 만들어진 걸 확인할 것.
    input:
      project_id: "PJT-EXAMPLE"
      title: "소상공인 재고관리 서비스"
      goal: "소상공인이 재고를 쉽게 등록하고 발주 시점을 놓치지 않도록 돕는다"
      overview: "소상공인들이 엑셀이나 수기 장부로 재고를 관리하며 겪는 발주 시점 누락, 과재고 손실 문제를 해결하기 위한 서비스다."
      background: ""
      target_users: "소상공인 사장: 매장 1~3개를 직접 운영하며 모바일 사용 비중이 높다. 재고 관리 자동화와 발주 시점 알림을 필요로 한다."
      key_features: "바코드 입출고 등록. 스마트폰 카메라로 상품 바코드를 인식해 입출고를 등록한다. 전용 스캐너 없이 사용할 수 있다."
      tech_stack: ""
      final_decisions: "[기능] MVP 기능은 바코드 입출고 등록으로 확정한다. [범위] 매출 예측 기능은 MVP 범위에서 제외하고 2차 개발로 이관한다."
      problem_definition: ""
      user_scenarios: ""
      requirements:
        - req_id: "REQ-01"
          content: "사용자가 스마트폰 카메라로 바코드를 인식해 입출고를 등록할 수 있어야 한다"
    output:
      requirements:
        - id: "FR-01-001"
          category_1: "기능"
          category_2: "재고 관리"
          title: "바코드 입출고 등록"
          description: "카메라 API를 통해 실시간으로 바코드를 인식하고, 인식된 코드값을 입출고 등록 로직에 전달해야 한다. 인식 실패 시 수동 입력 대체 수단을 제공해야 한다."
          type: "기능"
          priority: "High"
          source: "requirement_text"
          review_status: "검토완료"

  - description: >
      비기능(baseline, 기획서에 실제 언급이 있는 경우) — baseline 카테고리라도
      tech_stack에 관련 내용이 있으면 일반론적인 기본값 대신 그 내용을 근거로
      작성하고 source는 "requirement_text"를 쓴다. category_2에 NFR 표준
      카테고리명이 들어간다.
    input:
      project_id: "PJT-EXAMPLE"
      title: "소상공인 재고관리 서비스"
      goal: "소상공인이 재고를 쉽게 등록하고 발주 시점을 놓치지 않도록 돕는다"
      overview: ""
      background: ""
      target_users: ""
      key_features: ""
      tech_stack: "제약사항 [일정] 8주 / 스프린트 2주 단위 4회. 재고 조회 화면은 상품 수가 많은 매장에서도 지연 없이 표시되어야 한다."
      final_decisions: ""
      problem_definition: ""
      user_scenarios: ""
      requirements:
        - req_id: "REQ-02"
          content: "재고 조회 화면은 상품이 많아도 빠르게 표시되어야 한다"
    output:
      requirements:
        - id: "NFR-01-001"
          category_1: "비기능"
          category_2: "성능 효율성"
          title: "재고 조회 응답 속도"
          description: "상품 수가 많은 매장에서도 재고 조회 요청 시 결과가 사용자가 체감할 수 있는 지연 없이 표시되어야 한다."
          type: "비기능"
          priority: "Medium"
          source: "requirement_text"
          review_status: "검토완료"

  - description: >
      비기능(baseline, 기획서에 언급이 전혀 없는 경우) — 이때만 일반적인
      수준의 기본값으로 채우고 source는 "baseline_default",
      review_status는 "검토대기"로 설정한다.
    input:
      project_id: "PJT-EXAMPLE"
      title: "소상공인 재고관리 서비스"
      goal: "소상공인이 재고를 쉽게 등록하고 발주 시점을 놓치지 않도록 돕는다"
      overview: ""
      background: ""
      target_users: ""
      key_features: ""
      tech_stack: ""
      final_decisions: ""
      problem_definition: ""
      user_scenarios: ""
      requirements:
        - req_id: "REQ-03"
          content: "매장별로 담당 사장만 자기 재고를 볼 수 있어야 한다"
    output:
      requirements:
        - id: "NFR-02-001"
          category_1: "비기능"
          category_2: "보안성"
          title: "매장별 재고 접근 권한 제어"
          description: "인증된 사용자만 접근할 수 있으며, 사용자가 속한 매장에 따라 조회 가능한 재고 범위를 제어해야 한다."
          type: "비기능"
          priority: "High"
          source: "requirement_text"
          review_status: "검토완료"
        - id: "NFR-03-001"
          category_1: "비기능"
          category_2: "신뢰성"
          title: "재고 데이터 무결성 보장"
          description: "입출고 처리 중 오류가 발생해도 재고 수량이 부분 반영되거나 유실되지 않아야 한다."
          type: "비기능"
          priority: "High"
          source: "baseline_default"
          review_status: "검토대기"
