openapi: 3.0.3
info:
  title: 프로젝트 관리 시스템 API 명세서
  version: 1.0.0
  description: 회의록, 기획서, 요구사항 정의, 업무 배정 파이프라인 관리 API
paths:
  /api/common/codes/:
    get:
      operationId: common_codes_list
      description: 시스템 전체에서 사용되는 공통 코드(부서, 직급, 상태 등) 목록을 조회합니다. `group_code` 쿼리 파라미터를
        통해 특정 그룹 코드만 필터링할 수 있습니다.
      summary: 공통 코드 목록 조회
      parameters:
      - in: query
        name: group_code
        schema:
          type: string
        description: '필터링할 공통 코드 그룹 (예: DEPT, POSITION, STATUS)'
      tags:
      - 0단계 - 공통 메타데이터
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommonCode'
          description: ''
  /api/meetings/notes/:
    get:
      operationId: meetings_notes_list
      description: 등록된 전체 회의록 및 관련 기획서(spec_documents) 목록을 조회합니다.
      summary: 회의록 목록 조회
      tags:
      - 1단계 - 회의록 & 기획서
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingNote'
          description: ''
    post:
      operationId: meetings_notes_create
      description: 새로운 회의록을 작성합니다. 작성자(`created_by`)는 요청을 보낸 유저로 자동 매핑됩니다.
      summary: 신규 회의록 등록
      tags:
      - 1단계 - 회의록 & 기획서
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingNoteCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeetingNoteCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeetingNoteCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingNoteCreate'
          description: ''
  /api/meetings/notes/{meeting_id}/:
    get:
      operationId: meetings_notes_retrieve
      description: 특정 회의록의 상세 내용을 조회합니다.
      summary: 회의록 상세 조회
      parameters:
      - in: path
        name: meeting_id
        schema:
          type: integer
          title: 회의록 ID
        description: 회의록을 식별하는 고유한 정수 값.
        required: true
      tags:
      - 1단계 - 회의록 & 기획서
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingNote'
          description: ''
    put:
      operationId: meetings_notes_update
      description: 회의록 전체 필드를 수정합니다.
      summary: 회의록 전체 수정
      parameters:
      - in: path
        name: meeting_id
        schema:
          type: integer
          title: 회의록 ID
        description: 회의록을 식별하는 고유한 정수 값.
        required: true
      tags:
      - 1단계 - 회의록 & 기획서
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingNote'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeetingNote'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeetingNote'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingNote'
          description: ''
    patch:
      operationId: meetings_notes_partial_update
      description: 회의록 필드 일부를 수정합니다.
      summary: 회의록 부분 수정
      parameters:
      - in: path
        name: meeting_id
        schema:
          type: integer
          title: 회의록 ID
        description: 회의록을 식별하는 고유한 정수 값.
        required: true
      tags:
      - 1단계 - 회의록 & 기획서
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeetingNote'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeetingNote'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeetingNote'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingNote'
          description: ''
    delete:
      operationId: meetings_notes_destroy
      description: 특정 회의록을 삭제합니다.
      summary: 회의록 삭제
      parameters:
      - in: path
        name: meeting_id
        schema:
          type: integer
          title: 회의록 ID
        description: 회의록을 식별하는 고유한 정수 값.
        required: true
      tags:
      - 1단계 - 회의록 & 기획서
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/meetings/notes/{id}/analyze/:
    post:
      operationId: meetings_notes_analyze_create
      description: 회의록 텍스트를 AI로 분석하여 핵심 요약(`summary_content`)을 등록하고 기획서(`SpecDocument`)
        초안을 자동 생성합니다.
      summary: 회의록 AI 분석 및 기획 초안 생성
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: pk
        schema:
          type: integer
        description: 분석할 회의록 ID
        required: true
      tags:
      - 1단계 - 회의록 & 기획서
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingNote'
          description: AI 분석 및 기획서 생성 완료
        '404':
          description: 존재하지 않는 회의록
  /api/meetings/specs/:
    get:
      operationId: meetings_specs_list
      description: 생성된 기획서(SpecDocument) 목록을 조회합니다.
      summary: 기획서 목록 조회
      tags:
      - 1단계 - 회의록 & 기획서
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpecDocument'
          description: ''
    post:
      operationId: meetings_specs_create
      description: 신규 기획서를 수동으로 작성합니다.
      summary: 기획서 직접 작성
      tags:
      - 1단계 - 회의록 & 기획서
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecDocument'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SpecDocument'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SpecDocument'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecDocument'
          description: ''
  /api/meetings/specs/{spec_id}/:
    get:
      operationId: meetings_specs_retrieve
      description: 특정 기획서의 상세 정보를 조회합니다.
      summary: 기획서 상세 조회
      parameters:
      - in: path
        name: spec_id
        schema:
          type: integer
          title: 기획서 ID
        description: 기획서을 식별하는 고유한 정수 값.
        required: true
      tags:
      - 1단계 - 회의록 & 기획서
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecDocument'
          description: ''
    put:
      operationId: meetings_specs_update
      description: 기획서 내용을 전체 수정합니다.
      summary: 기획서 전체 수정
      parameters:
      - in: path
        name: spec_id
        schema:
          type: integer
          title: 기획서 ID
        description: 기획서을 식별하는 고유한 정수 값.
        required: true
      tags:
      - 1단계 - 회의록 & 기획서
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecDocument'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SpecDocument'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SpecDocument'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecDocument'
          description: ''
    patch:
      operationId: meetings_specs_partial_update
      description: 기획서 내용 일부를 수정합니다.
      summary: 기획서 부분 수정
      parameters:
      - in: path
        name: spec_id
        schema:
          type: integer
          title: 기획서 ID
        description: 기획서을 식별하는 고유한 정수 값.
        required: true
      tags:
      - 1단계 - 회의록 & 기획서
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSpecDocument'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSpecDocument'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSpecDocument'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecDocument'
          description: ''
  /api/meetings/specs/{id}/review/:
    patch:
      operationId: meetings_specs_review_partial_update
      description: 기획서에 대한 검토 의견(`review_comment`)과 검토자 정보를 업데이트합니다. `project_id`
        전달 시 `PipelineHistory` 타임라인 이력이 자동 생성됩니다.
      summary: 기획서 검토 및 승인 처리
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: pk
        schema:
          type: integer
        description: 검토 승인할 기획서 ID
        required: true
      tags:
      - 1단계 - 회의록 & 기획서
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecDocument'
          description: 기획서 검토 완료 및 히스토리 기록 완료
  /api/projects/:
    get:
      operationId: projects_list
      description: 등록된 전체 프로젝트 목록을 조회합니다.
      summary: 프로젝트 목록 조회
      tags:
      - 0단계 - 프로젝트 관리
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
          description: ''
    post:
      operationId: projects_create
      description: 새로운 프로젝트를 생성합니다. 작성자(`owner`)는 요청을 보낸 유저로 자동 지정됩니다.
      summary: 신규 프로젝트 생성
      tags:
      - 0단계 - 프로젝트 관리
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/projects/{id}/:
    get:
      operationId: projects_retrieve
      description: 특정 프로젝트의 상세 정보를 조회합니다.
      summary: 프로젝트 상세 조회
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 0단계 - 프로젝트 관리
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    put:
      operationId: projects_update
      description: 특정 프로젝트의 정보를 전체 수정합니다.
      summary: 프로젝트 전체 수정
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 0단계 - 프로젝트 관리
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    patch:
      operationId: projects_partial_update
      description: 특정 프로젝트의 정보 일부를 수정합니다.
      summary: 프로젝트 부분 수정
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 0단계 - 프로젝트 관리
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProject'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProject'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    delete:
      operationId: projects_destroy
      description: 특정 프로젝트를 삭제합니다.
      summary: 프로젝트 삭제
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 0단계 - 프로젝트 관리
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/projects/{project_id}/history/:
    get:
      operationId: projects_history_list
      description: "특정 프로젝트의 전체 파이프라인 흐름(회의록 $\rightarrow$ 기획서 $\rightarrow$ 요구사항
        $\rightarrow$ 업무 배정) 이력 로그를 시간순으로 조회합니다. 프론트엔드의 `/history` 타임라인 페이지에서 사용됩니다."
      summary: 프로젝트 파이프라인 타임라인 이력 조회
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        description: 타임라인 이력을 조회할 프로젝트 ID
        required: true
      tags:
      - 4단계 - 파이프라인 이력
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PipelineHistory'
          description: ''
  /api/requirements/:
    get:
      operationId: requirements_list
      description: 등록된 전체 요구사항 정의서 목록과 포함된 세부 항목들을 함께 조회합니다.
      summary: 요구사항 정의서 목록 조회
      tags:
      - 2단계 - 요구사항 정의서
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequirementDefinition'
          description: ''
    post:
      operationId: requirements_create
      description: 새로운 요구사항 정의서를 생성합니다. 작성자(`created_by`)는 현재 로그인한 유저로 자동 지정됩니다.
      summary: 요구사항 정의서 신규 등록
      tags:
      - 2단계 - 요구사항 정의서
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementDefinitionCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequirementDefinitionCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequirementDefinitionCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementDefinitionCreate'
          description: ''
  /api/requirements/{id}/:
    get:
      operationId: requirements_retrieve
      description: 특정 요구사항 정의서의 상세 정보 및 하위 요구사항 항목들을 조회합니다.
      summary: 요구사항 정의서 상세 조회
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 2단계 - 요구사항 정의서
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementDefinition'
          description: ''
    put:
      operationId: requirements_update
      description: 특정 요구사항 정의서의 전체 필드를 수정합니다.
      summary: 요구사항 정의서 전체 수정
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 2단계 - 요구사항 정의서
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementDefinition'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequirementDefinition'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequirementDefinition'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementDefinition'
          description: ''
    patch:
      operationId: requirements_partial_update
      description: 특정 요구사항 정의서의 일부 필드를 수정합니다.
      summary: 요구사항 정의서 부분 수정
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 2단계 - 요구사항 정의서
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRequirementDefinition'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRequirementDefinition'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRequirementDefinition'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementDefinition'
          description: ''
    delete:
      operationId: requirements_destroy
      description: 특정 요구사항 정의서를 삭제합니다.
      summary: 요구사항 정의서 삭제
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 2단계 - 요구사항 정의서
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/requirements/{id}/extract/:
    post:
      operationId: requirements_extract_create
      description: 연관된 기획서(`SpecDocument`)의 내용을 분석하여 REQ 코드별 세부 요구사항 항목(`RequirementItem`)을
        자동 생성 및 바인딩합니다.
