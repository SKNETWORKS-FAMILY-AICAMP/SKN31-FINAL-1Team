          type: string
          title: 코드 그룹 ID
          readOnly: true
        code_name:
          type: string
          title: 코드명
          maxLength: 100
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: 정렬 순서
        is_active:
          type: boolean
          title: 사용 여부
        description:
          type: string
          nullable: true
          title: 설명
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 생성 일시
      required:
      - code_id
      - code_name
      - created_at
      - group_code
    CommonCodeSimple:
      type: object
      description: 상태/그룹 코드 단순 조회용 Serializer
      properties:
        code_id:
          type: string
          title: 코드 ID
          maxLength: 50
        code_name:
          type: string
          title: 코드명
          maxLength: 100
      required:
