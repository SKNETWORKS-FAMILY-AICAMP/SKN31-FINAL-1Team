openapi: 3.0.3
info:
  title: 개발부서 팀장 업무 대시보드 API Document
  version: 1.0.0
  description: 회의록 - 기획서 - 업무 배분 자동화 파이프라인 API 명세서입니다.
paths:
  /api/v1/meetings/:
    get:
      operationId: meetings_list
      summary: 회의록 목록 조회
      tags:
      - 회의록
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingNote'
          description: ''
    post:
      operationId: meetings_create
      summary: 회의록 작성/저장
      tags:
      - 회의록
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingNote'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeetingNote'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeetingNote'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingNote'
          description: ''
  /api/v1/meetings/{id}/:
    get:
      operationId: meetings_retrieve
      summary: 회의록 상세 조회
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: meeting note을 식별하는 고유한 정수 값.
        required: true
      tags:
      - 회의록
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingNote'
          description: ''
    put:
      operationId: meetings_update
      summary: 회의록 전체 수정
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: meeting note을 식별하는 고유한 정수 값.
        required: true
      tags:
      - 회의록
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingNote'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeetingNote'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeetingNote'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingNote'
          description: ''
    patch:
      operationId: meetings_partial_update
      summary: 회의록 부분 수정
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: meeting note을 식별하는 고유한 정수 값.
        required: true
      tags:
      - 회의록
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeetingNote'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeetingNote'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeetingNote'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingNote'
          description: ''
    delete:
      operationId: meetings_destroy
      summary: 회의록 삭제
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: meeting note을 식별하는 고유한 정수 값.
        required: true
      tags:
      - 회의록
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/meetings/{id}/review-complete/:
    post:
      operationId: meetings_review_complete_create
      description: 회의록 상태를 REVIEWED로 변경하고, 백그라운드 태스크를 호출해 기획서 자동 생성을 시작합니다.
      summary: 1-1. 회의록 검토 완료 처리
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: meeting note을 식별하는 고유한 정수 값.
        required: true
      tags:
      - 회의록
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingNote'
          description: 검토 완료 성공 및 기획서 생성 시작
        '400':
          description: 이미 검토 완료된 회의록인 경우
  /api/v1/reset-test-data/:
    post:
      operationId: reset_test_data_create
      tags:
      - reset-test-data
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/specs/:
    get:
      operationId: specs_list
      description: |-
        기획서는 회의록 검토 완료 시 자동 생성되므로 ReadOnlyModelViewSet을 사용하고,
        검토완료/다운로드 액션만 추가합니다.
      tags:
      - specs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpecDocument'
          description: ''
  /api/v1/specs/{id}/:
    get:
      operationId: specs_retrieve
      description: |-
        기획서는 회의록 검토 완료 시 자동 생성되므로 ReadOnlyModelViewSet을 사용하고,
        검토완료/다운로드 액션만 추가합니다.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: spec document을 식별하는 고유한 정수 값.
        required: true
      tags:
      - specs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecDocument'
          description: ''
  /api/v1/specs/{id}/download/:
    get:
      operationId: specs_download_retrieve
      description: 기획서 파일 다운로드 API
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: spec document을 식별하는 고유한 정수 값.
        required: true
      tags:
      - specs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecDocument'
          description: ''
  /api/v1/specs/{id}/review-complete/:
    post:
      operationId: specs_review_complete_create
      description: |-
        2-1. 기획서 검토완료 버튼 클릭 시 호출
        - 기획서 상태를 REVIEWED로 변경
        - 작업중인 사원을 제외한 업무 배분 API/서비스 연동
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: spec document을 식별하는 고유한 정수 값.
        required: true
      tags:
      - specs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecDocument'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SpecDocument'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SpecDocument'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecDocument'
          description: ''
  /api/v1/tasks/:
    get:
      operationId: tasks_list
      tags:
      - tasks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskAssignment'
          description: ''
    post:
      operationId: tasks_create
      tags:
      - tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAssignment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskAssignment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskAssignment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAssignment'
          description: ''
  /api/v1/tasks/{id}/:
    get:
      operationId: tasks_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: task assignment을 식별하는 고유한 정수 값.
        required: true
      tags:
      - tasks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAssignment'
          description: ''
    put:
      operationId: tasks_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: task assignment을 식별하는 고유한 정수 값.
        required: true
      tags:
      - tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAssignment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskAssignment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskAssignment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAssignment'
          description: ''
    patch:
      operationId: tasks_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: task assignment을 식별하는 고유한 정수 값.
        required: true
      tags:
      - tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTaskAssignment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTaskAssignment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTaskAssignment'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAssignment'
          description: ''
    delete:
      operationId: tasks_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: task assignment을 식별하는 고유한 정수 값.
        required: true
      tags:
      - tasks
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/tasks/approve-all/:
    post:
      operationId: tasks_approve_all_create
      description: |-
        3-1. 업무 배분 검토 (팀장 승인 버튼 > 개별 사원 알림 API)
        - 선택된(또는 대기 중인) 업무 배분안을 최종 승인(APPROVED) 처리
        - 배정된 사원들의 상태를 is_busy = True로 업데이트
        - 각 사원에게 개별 알림 전송
      tags:
      - tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAssignment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskAssignment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskAssignment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAssignment'
          description: ''
  /api/v1/tasks/pending/:
    get:
      operationId: tasks_pending_retrieve
      description: 승인 대기(PENDING_APPROVAL) 중인 업무 배정 목록 조회
      tags:
      - tasks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAssignment'
          description: ''
  /api/v1/users/:
    get:
      operationId: users_list
      description: 유저 관련 API (회원가입, 조회, 정보수정)
      summary: 유저 목록 조회
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
          description: ''
    post:
      operationId: users_create
      description: 유저 관련 API (회원가입, 조회, 정보수정)
      summary: 회원가입
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/users/{id}/:
    get:
      operationId: users_retrieve
      description: 유저 관련 API (회원가입, 조회, 정보수정)
      summary: 유저 상세 조회
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 사용자을 식별하는 고유한 정수 값.
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: users_update
      description: 유저 관련 API (회원가입, 조회, 정보수정)
      summary: 유저 정보 전체 수정
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 사용자을 식별하는 고유한 정수 값.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdate'
          description: ''
    patch:
      operationId: users_partial_update
      description: 유저 관련 API (회원가입, 조회, 정보수정)
      summary: 유저 정보 부분 수정
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 사용자을 식별하는 고유한 정수 값.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdate'
          description: ''
    delete:
      operationId: users_destroy
      description: 유저 관련 API (회원가입, 조회, 정보수정)
      summary: 유저 삭제
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 사용자을 식별하는 고유한 정수 값.
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/users/login/:
    post:
      operationId: users_login_create
      description: 아이디와 비밀번호를 받아 Access 및 Refresh 토큰을 발급합니다.
      summary: 로그인 (JWT 토큰 발급)
      tags:
      - 유저
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/users/me/:
    get:
      operationId: users_me_retrieve
      description: 로그인된 사용자의 본인 프로필 정보를 조회합니다.
      summary: 내 정보 조회
      tags:
      - 유저
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: users_me_partial_update
      description: 로그인된 사용자의 비밀번호를 수정합니다.
      summary: 내 비밀번호 수정
      tags:
      - 유저
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: 비밀번호 변경 완료
  /api/v1/users/refresh/:
    post:
      operationId: users_refresh_create
      description: Refresh 토큰을 전달받아 새로운 Access 토큰을 재발급합니다.
      summary: JWT 토큰 재발급
      tags:
      - 유저
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
components:
  schemas:
    MeetingNote:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        content:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/MeetingNoteStatusEnum'
          readOnly: true
        created_by:
          type: integer
          readOnly: true
        created_by_name:
          type: string
          title: 사용자 이름
          description: 150자 이하 문자, 숫자 그리고 @/./+/-/_만 가능합니다.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - created_by
      - created_by_name
      - id
      - status
      - title
      - updated_at
    MeetingNoteStatusEnum:
      enum:
      - DRAFT
      - REVIEWED
      type: string
      description: |-
        * `DRAFT` - 작성 중
        * `REVIEWED` - 검토 완료
    PatchedMeetingNote:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        content:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/MeetingNoteStatusEnum'
          readOnly: true
        created_by:
          type: integer
          readOnly: true
        created_by_name:
          type: string
          title: 사용자 이름
          description: 150자 이하 문자, 숫자 그리고 @/./+/-/_만 가능합니다.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedTaskAssignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        spec:
          type: integer
        spec_title:
          type: string
          readOnly: true
        assigned_user:
          type: integer
        assigned_user_name:
          type: string
          title: 사용자 이름
          description: 150자 이하 문자, 숫자 그리고 @/./+/-/_만 가능합니다.
          readOnly: true
        assigned_user_email:
          type: string
          format: email
          title: 이메일 주소
          readOnly: true
        task_title:
          type: string
          maxLength: 200
        task_description:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/TaskAssignmentStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedUserUpdate:
      type: object
      description: 본인 정보 수정. 현재는 비밀번호만 변경 전용.
      properties:
        password:
          type: string
          writeOnly: true
    Register:
      type: object
      description: 회원가입 전용 (user_id, username, password 모두 입력받음)
      properties:
        user_id:
          type: string
          maxLength: 50
        username:
          type: string
          maxLength: 50
        password:
          type: string
          writeOnly: true
          maxLength: 255
          minLength: 8
      required:
      - password
      - user_id
      - username
    RoleEnum:
      enum:
      - LEADER
      - MEMBER
      type: string
      description: |-
        * `LEADER` - 팀장
        * `MEMBER` - 팀원
    SpecDocument:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        meeting:
          type: integer
          readOnly: true
        meeting_title:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        summary:
          type: string
        file:
          type: string
          format: uri
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/SpecDocumentStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - meeting
      - meeting_title
      - status
      - title
    SpecDocumentStatusEnum:
      enum:
      - GENERATING
      - COMPLETED
      - REVIEWED
      type: string
      description: |-
        * `GENERATING` - 생성 중
        * `COMPLETED` - 생성 완료
        * `REVIEWED` - 검토 완료
    TaskAssignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        spec:
          type: integer
        spec_title:
          type: string
          readOnly: true
        assigned_user:
          type: integer
        assigned_user_name:
          type: string
          title: 사용자 이름
          description: 150자 이하 문자, 숫자 그리고 @/./+/-/_만 가능합니다.
          readOnly: true
        assigned_user_email:
          type: string
          format: email
          title: 이메일 주소
          readOnly: true
        task_title:
          type: string
          maxLength: 200
        task_description:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/TaskAssignmentStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assigned_user
      - assigned_user_email
      - assigned_user_name
      - created_at
      - id
      - spec
      - spec_title
      - status
      - task_description
      - task_title
    TaskAssignmentStatusEnum:
      enum:
      - PENDING_APPROVAL
      - APPROVED
      type: string
      description: |-
        * `PENDING_APPROVAL` - 승인 대기
        * `APPROVED` - 승인 및 알림 완료
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    User:
      type: object
      description: 유저 정보 조회 전용
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: string
          readOnly: true
        username:
          type: string
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_busy:
          type: boolean
          description: 현재 작업 중 여부
      required:
      - id
      - user_id
      - username
    UserUpdate:
      type: object
      description: 본인 정보 수정. 현재는 비밀번호만 변경 전용.
      properties:
        password:
          type: string
          writeOnly: true
      required:
      - password
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
