          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 생성 일시
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: 수정 일시
      required:
      - content
      - created_at
      - created_by
      - created_by_name
      - id
      - meeting_id
      - spec_documents
      - status_display
      - title
      - updated_at
