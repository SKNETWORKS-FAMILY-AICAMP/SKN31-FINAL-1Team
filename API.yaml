          type: integer
          readOnly: true
          title: 회의록 ID
        title:
          type: string
          title: 회의 제목
          maxLength: 200
        content:
          type: string
          title: 회의록 원문/내용
        summary_content:
          type: string
          nullable: true
          title: AI 핵심 요약
        meeting_date:
          type: string
          format: date-time
          nullable: true
          title: 회의 일시
        attendees:
          type: string
          nullable: true
          title: 참석자 목록
        status:
          allOf:
          - $ref: '#/components/schemas/MeetingNoteStatusEnum'
