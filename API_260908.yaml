openapi: 3.0.3
info:
  title: 프로젝트 관리 시스템 API 명세서
  version: 1.0.0
  description: 회의록, 기획서, 요구사항 정의, 업무 배정 파이프라인 관리 API
paths:
  /api/common/codes/:
    get:
      operationId: common_codes_list
      description: 시스템 전체에서 사용되는 공통 코드(부서, 직급, 상태 등) 목록을 조회합니다. `group_code` 쿼리 파라미터를
        통해 특정 그룹 코드만 필터링할 수 있습니다.
      summary: 공통 코드 목록 조회
      parameters:
      - in: query
        name: group_code
        schema:
          type: string
        description: '필터링할 공통 코드 그룹 (예: DEPT, POSITION, STATUS)'
      tags:
      - 0단계 - 공통 메타데이터
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommonCode'
          description: ''
  /api/dashboard/analytics/:
    get:
      operationId: dashboard_analytics_retrieve
      description: 최근 7일 완료 추이, 팀원별 기여도, 평균 처리 시간, 승인 통과율, 프로젝트 번다운 현황을 집계합니다.
      summary: 대시보드 성과 통계 조회 (PM 전용)
      tags:
      - 0단계 - 대시보드
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAnalyticsResponse'
          description: ''
  /api/dashboard/overview/:
    get:
      operationId: dashboard_overview_retrieve
      description: 유저 권한(PM/일반)에 따라 대시보드 요약, 상태 차트, 업무량, 활동 로그, 프로젝트 목록을 집계하여 반환합니다.
      summary: 대시보드 개요 집계 조회
      tags:
      - 0단계 - 대시보드
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOverviewResponse'
          description: ''
  /api/meetings/notes/:
    get:
      operationId: meetings_notes_list
      description: |-
        회의록 목록 조회 및 작성 API
        GET/POST /api/meetings/notes/
      tags:
      - meetings
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingNote'
          description: ''
    post:
      operationId: meetings_notes_create
      description: |-
        회의록 목록 조회 및 작성 API
        GET/POST /api/meetings/notes/
      tags:
      - meetings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingNoteCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeetingNoteCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeetingNoteCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingNoteCreate'
          description: ''
  /api/meetings/notes/{meeting_id}/:
    get:
      operationId: meetings_notes_retrieve
      description: 회의록 상세 조회, 수정, 삭제
      parameters:
      - in: path
        name: meeting_id
        schema:
          type: integer
          title: 회의록 ID
        description: 회의록을 식별하는 고유한 정수 값.
        required: true
      tags:
      - meetings
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingNote'
          description: ''
    put:
      operationId: meetings_notes_update
      description: 회의록 상세 조회, 수정, 삭제
      parameters:
      - in: path
        name: meeting_id
        schema:
          type: integer
          title: 회의록 ID
        description: 회의록을 식별하는 고유한 정수 값.
        required: true
      tags:
      - meetings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingNote'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeetingNote'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeetingNote'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingNote'
          description: ''
    patch:
      operationId: meetings_notes_partial_update
      description: 회의록 상세 조회, 수정, 삭제
      parameters:
      - in: path
        name: meeting_id
        schema:
          type: integer
          title: 회의록 ID
        description: 회의록을 식별하는 고유한 정수 값.
        required: true
      tags:
      - meetings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeetingNote'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeetingNote'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeetingNote'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingNote'
          description: ''
    delete:
      operationId: meetings_notes_destroy
      description: 회의록 상세 조회, 수정, 삭제
      parameters:
      - in: path
        name: meeting_id
        schema:
          type: integer
          title: 회의록 ID
        description: 회의록을 식별하는 고유한 정수 값.
        required: true
      tags:
      - meetings
      responses:
        '204':
          description: No response body
  /api/meetings/notes/{id}/analyze/:
    post:
      operationId: meetings_notes_analyze_create
      description: |-
        회의록 AI 분석 및 기획 초안 자동 생성 API
        POST /api/meetings/notes/{id}/analyze/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - meetings
      responses:
        '200':
          description: No response body
  /api/meetings/notes/parse-file/:
    post:
      operationId: meetings_notes_parse_file_create
      description: .docx/.pdf/.txt/.md/.hwp 파일을 업로드하면 텍스트를 추출해서 돌려준다. DB에 저장하지 않는다.
      summary: 회의록 첨부 파일 텍스트 추출
      tags:
      - 1단계 - 회의록
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 추출된 텍스트
  /api/meetings/specs/:
    get:
      operationId: meetings_specs_list
      description: 기획서 목록 조회 및 생성
      tags:
      - meetings
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpecDocument'
          description: ''
    post:
      operationId: meetings_specs_create
      description: 기획서 목록 조회 및 생성
      tags:
      - meetings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecDocument'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SpecDocument'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SpecDocument'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecDocument'
          description: ''
  /api/meetings/specs/{spec_id}/:
    get:
      operationId: meetings_specs_retrieve
      description: 기획서 상세 조회, 수정, 삭제
      parameters:
      - in: path
        name: spec_id
        schema:
          type: integer
          title: 기획서 ID
        description: 기획서을 식별하는 고유한 정수 값.
        required: true
      tags:
      - meetings
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecDocument'
          description: ''
    put:
      operationId: meetings_specs_update
      description: 기획서 상세 조회, 수정, 삭제
      parameters:
      - in: path
        name: spec_id
        schema:
          type: integer
          title: 기획서 ID
        description: 기획서을 식별하는 고유한 정수 값.
        required: true
      tags:
      - meetings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecDocument'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SpecDocument'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SpecDocument'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecDocument'
          description: ''
    patch:
      operationId: meetings_specs_partial_update
      description: 기획서 상세 조회, 수정, 삭제
      parameters:
      - in: path
        name: spec_id
        schema:
          type: integer
          title: 기획서 ID
        description: 기획서을 식별하는 고유한 정수 값.
        required: true
      tags:
      - meetings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSpecDocument'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSpecDocument'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSpecDocument'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecDocument'
          description: ''
    delete:
      operationId: meetings_specs_destroy
      description: 기획서 상세 조회, 수정, 삭제
      parameters:
      - in: path
        name: spec_id
        schema:
          type: integer
          title: 기획서 ID
        description: 기획서을 식별하는 고유한 정수 값.
        required: true
      tags:
      - meetings
      responses:
        '204':
          description: No response body
  /api/meetings/specs/{id}/approve/:
    post:
      operationId: meetings_specs_approve_create
      description: 기획서 승인 처리
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - meetings
      responses:
        '200':
          description: No response body
  /api/meetings/specs/{id}/reject/:
    post:
      operationId: meetings_specs_reject_create
      description: 기획서 반려 처리
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - meetings
      responses:
        '200':
          description: No response body
  /api/meetings/specs/{id}/review/:
    post:
      operationId: meetings_specs_review_create
      description: 기획서 검토 의견 작성/수정
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - meetings
      responses:
        '200':
          description: No response body
  /api/meetings/specs/{id}/submit-review/:
    post:
      operationId: meetings_specs_submit_review_create
      description: 기획서 검토 요청 전송
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - meetings
      responses:
        '200':
          description: No response body
    patch:
      operationId: meetings_specs_submit_review_partial_update
      description: 기획서 검토 요청 전송
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - meetings
      responses:
        '200':
          description: No response body
  /api/notifications/:
    get:
      operationId: notifications_list
      description: |-
        내 알림 목록 조회 API
        GET /api/notifications/
        (userId 쿼리 파라미터를 안 받는다 — 로그인한 본인 알림만 항상 request.user 기준으로 조회한다)
      tags:
      - notifications
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
          description: ''
  /api/notifications/{id}/read/:
    patch:
      operationId: notifications_read_partial_update
      description: |-
        알림 하나 읽음 처리
        PATCH /api/notifications/{id}/read/
      summary: 알림 읽음 처리
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 알림
      responses:
        '200':
          description: No response body
  /api/notifications/read-all/:
    patch:
      operationId: notifications_read_all_partial_update
      description: |-
        내 알림 전체 읽음 처리
        PATCH /api/notifications/read-all/
      summary: 알림 전체 읽음 처리
      tags:
      - 알림
      responses:
        '200':
          description: No response body
  /api/projects/:
    get:
      operationId: projects_list
      description: 등록된 전체 프로젝트 목록을 조회합니다.
      summary: 프로젝트 목록 조회
      tags:
      - 0단계 - 프로젝트 관리
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
          description: ''
    post:
      operationId: projects_create
      description: 새로운 프로젝트를 생성합니다. 작성자(`owner`)는 요청을 보낸 유저로 자동 지정됩니다.
      summary: 신규 프로젝트 생성
      tags:
      - 0단계 - 프로젝트 관리
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/projects/{id}/:
    get:
      operationId: projects_retrieve
      description: 특정 프로젝트의 상세 정보를 조회합니다.
      summary: 프로젝트 상세 조회
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 0단계 - 프로젝트 관리
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    put:
      operationId: projects_update
      description: 특정 프로젝트의 정보를 전체 수정합니다.
      summary: 프로젝트 전체 수정
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 0단계 - 프로젝트 관리
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    patch:
      operationId: projects_partial_update
      description: 특정 프로젝트의 정보 일부를 수정합니다.
      summary: 프로젝트 부분 수정
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 0단계 - 프로젝트 관리
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProject'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProject'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    delete:
      operationId: projects_destroy
      description: 특정 프로젝트를 삭제합니다.
      summary: 프로젝트 삭제
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 0단계 - 프로젝트 관리
      responses:
        '204':
          description: No response body
  /api/projects/{project_id}/history/:
    get:
      operationId: projects_history_list
      description: "특정 프로젝트의 전체 파이프라인 흐름(회의록 $\rightarrow$ 기획서 $\rightarrow$ 요구사항
        $\rightarrow$ 업무 배정) 이력 로그를 시간순으로 조회합니다. 프론트엔드의 `/history` 타임라인 페이지에서 사용됩니다."
      summary: 프로젝트 파이프라인 타임라인 이력 조회
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        description: 타임라인 이력을 조회할 프로젝트 ID
        required: true
      tags:
      - 4단계 - 파이프라인 이력
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PipelineHistory'
          description: ''
  /api/requirements/:
    get:
      operationId: requirements_list
      description: 등록된 전체 요구사항 정의서 목록을 조회합니다. `spec` 또는 `project` ID 쿼리 파라미터를 이용해
        특정 기획서/프로젝트별 필터링이 가능합니다.
      summary: 요구사항 정의서 목록 조회
      parameters:
      - in: query
        name: project
        schema:
          type: integer
        description: 프로젝트 ID (Project ID)로 필터링
      - in: query
        name: spec
        schema:
          type: integer
        description: 기획서 ID (SpecDocument ID)로 필터링
      tags:
      - 2단계 - 요구사항 정의서
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequirementDefinition'
          description: ''
    post:
      operationId: requirements_create
      description: 기획서 ID(`spec`)를 전달받아 요구사항 정의서 생성과 동시에 AI 에이전트가 세부 항목(RequirementItem)을
        자동 추출 및 저장합니다.
      summary: 요구사항 정의서 생성 (AI 세부항목 자동 추출 포함)
      tags:
      - 2단계 - 요구사항 정의서
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementDefinitionCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequirementDefinitionCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequirementDefinitionCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementDefinition'
          description: ''
        '400':
          description: 잘못된 파라미터 또는 기획서 데이터
        '500':
          description: AI 생성 또는 저장 오류
  /api/requirements/{spec_id}/:
    get:
      operationId: requirements_retrieve
      description: 특정 기획서 ID(`spec_id`)에 연관된 요구사항 정의서의 상세 정보 및 하위 요구사항 항목들을 조회합니다.
      summary: 요구사항 정의서 상세 조회
      parameters:
      - in: path
        name: spec_id
        schema:
          type: integer
        required: true
      tags:
      - 2단계 - 요구사항 정의서
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementDefinition'
          description: ''
    put:
      operationId: requirements_update
