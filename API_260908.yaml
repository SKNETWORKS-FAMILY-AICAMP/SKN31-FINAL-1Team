          type: array
          items:
            $ref: '#/components/schemas/TeamContributionItem'
        averageProcessTime:
          type: number
          format: double
        approvalPassRate:
          $ref: '#/components/schemas/ApprovalPassRate'
        projectBurndown:
          type: array
          items:
            $ref: '#/components/schemas/ProjectBurndownItem'
      required:
      - approvalPassRate
      - averageProcessTime
      - projectBurndown
      - teamContribution
      - weeklyCompletion
