        진짜로 삭제하면 그 직원이 배정받았던 업무 기록이 전부 함께 지워지기 때문입니다 — 대신 is_active=False로 바꾸고 status_code를
        RESIGNED로, resign_date를 오늘 날짜로 채웁니다. 목록 조회(GET /api/users/)는 is_active=True만
        보여주므로 화면에서는 즉시 사라집니다.
